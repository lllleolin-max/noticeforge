name: ordinary-wheel
on: [push, pull_request]
jobs:
  installed:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - shell: bash
        run: python -m pip install dist/noticeforge-*.whl
      - run: python -I -m unittest discover -s tests -v
      - run: noticeforge --version
      - run: python examples/pilot.py pilot-output --cli noticeforge
